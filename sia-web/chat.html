<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sia — Scholaxia AI Tutor</title>
  <link rel="stylesheet" href="chat.css" />
</head>
<body>

<div id="app" class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <a href="index.html" class="sidebar-brand">
        <div class="logo-mark-sm">S</div>
        <span>Scholaxia</span>
      </a>
      <button class="new-chat-btn" onclick="newChat()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New chat
      </button>
      <a href="classroom.html" class="classroom-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Voice Classroom
      </a>
    </div>

    <div class="sidebar-history" id="chat-history"></div>

    <div class="sidebar-bottom">
      <div class="mode-selector">
        <label>Mode</label>
        <select id="sia-mode" onchange="updateMode()">
          <option value="ask">Ask anything</option>
          <option value="explain">Explain concept</option>
          <option value="solve">Solve problem</option>
          <option value="evaluate">Check my answer</option>
          <option value="generate-questions">Practice questions</option>
          <option value="feedback">My performance</option>
        </select>
      </div>
      <div class="mode-selector">
        <label>Language</label>
        <select id="sia-language">
          <option value="english">English (auto-detect)</option>
          <option value="yoruba">Yoruba</option>
          <option value="igbo">Igbo</option>
          <option value="hausa">Hausa</option>
          <option value="pidgin">Pidgin</option>
          <option value="french">French</option>
          <option value="arabic">Arabic</option>
        </select>
      </div>
      <div class="user-info">
        <div class="user-avatar" id="user-avatar">A</div>
        <span id="user-name-display">Student</span>
        <button class="logout-btn" onclick="logout()" title="Log out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    <div id="board-panel" class="board-panel" style="display:none">
      <div class="board-header">
        <span>📋 Sia's Board</span>
        <button onclick="clearBoard()" class="board-close">✕</button>
      </div>
      <div id="board-content" class="board-content"></div>
    </div>

    <main class="chat-area">
      <div id="empty-state" class="empty-state">
        <div class="sia-welcome">
          <div class="sia-avatar-large">S</div>
          <h2 id="welcome-name">Hi, I'm Sia</h2>
          <p>Your personal AI study buddy.<br/>Ask me anything — by text or send a photo of your question.</p>
          <div class="suggestion-chips">
            <button onclick="sendSuggestion('Teach me heat in physics', 'Physics')">⚡ Heat in Physics</button>
            <button onclick="sendSuggestion('Solve: 2x + 5 = 15', 'Mathematics')">🔢 Solve equation</button>
            <button onclick="sendSuggestion('What is photosynthesis?', 'Biology')">🌿 Photosynthesis</button>
            <button onclick="sendSuggestion('Explain Newton third law', 'Physics')">🍎 Newton's laws</button>
          </div>
        </div>
      </div>

      <div id="messages" class="messages"></div>

      <div class="input-area">
        <div id="image-preview" class="image-preview" style="display:none">
          <img id="preview-img" src="" alt="Selected image" />
          <button onclick="clearImage()" class="remove-image">✕</button>
        </div>

        <div class="input-row">
          <select id="subject-input" class="subject-select-main">
            <option value="General">Select Subject</option>
            <option value="Mathematics">Mathematics</option>
            <option value="English">English Language</option>
            <option value="Physics">Physics</option>
            <option value="Chemistry">Chemistry</option>
            <option value="Biology">Biology</option>
            <option value="Geography">Geography</option>
            <option value="History">History</option>
            <option value="Economics">Economics</option>
            <option value="Government">Government</option>
            <option value="Literature">Literature in English</option>
            <option value="Agricultural Science">Agricultural Science</option>
            <option value="Further Mathematics">Further Mathematics</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Civic Education">Civic Education</option>
            <option value="Christian Religious Studies">CRS</option>
            <option value="Islamic Religious Studies">IRS</option>
            <option value="French">French</option>
            <option value="Yoruba">Yoruba Language</option>
            <option value="Igbo">Igbo Language</option>
            <option value="Hausa">Hausa Language</option>
          </select>
          <div class="input-box">
            <textarea id="chat-input" placeholder="Message Sia..." rows="1"
              onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
            <button onclick="document.getElementById('image-input').click()" class="icon-btn" title="Send image">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
            </button>
            <input type="file" id="image-input" accept="image/*" style="display:none" onchange="handleImageSelect(event)" />
            <button id="send-btn" onclick="sendMessage()" class="send-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
            </button>
          </div>
        </div>
        <p class="disclaimer">Sia only helps with educational topics • Powered by Scholaxia</p>
      </div>
    </main>
  </div>
</div>

<audio id="sia-audio" style="display:none"></audio>
<script src="chat.js"></script>
<script>
// Redirect to auth if not logged in
if (!localStorage.getItem("sia_token")) window.location.href = "auth.html";
// Update welcome message
const n = localStorage.getItem("sia_name") || "";
const fn = n.includes("@") ? n.split("@")[0] : n.split(" ")[0];
if (fn) document.getElementById("welcome-name").textContent = `Hi ${fn}, I'm Sia`;
</script>
</body>
</html>
